[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-os"
version = "0.1.0"
description = "Experiment registry, data provenance and statistical validation for quantitative research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RasmusCodes" }]
keywords = ["quantitative finance", "backtesting", "experiment tracking", "reproducibility", "deflated sharpe ratio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/RasmusCodes/quant-research-os"
Demo = "https://rasmuscodes.github.io/projects/research-os/"

[project.scripts]
qros = "qros.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qros = ["registry/schema.sql", "dashboard/static/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: builds the full demo registry (deselect with -m 'not slow')",
]
