name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,parquet]"
      - name: Unit tests
        run: python -m pytest -m "not slow"

  demo-and-browser-parity:
    name: Demo build and JavaScript parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,parquet]"
      - name: Toy experiment in JavaScript reproduces the Python hashes
        run: node tests/js/toy_parity.mjs
      - name: Full suite, including the quick demo build
        run: python -m pytest
      - name: Without pyarrow (qcsv storage)
        run: |
          python -m pip uninstall -y pyarrow
          python -m pytest -m "not slow" tests/test_provenance.py tests/test_registry.py tests/test_pipeline.py

  rust:
    name: Rust crate and Rust-to-qros ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crate tests
        working-directory: integrations/rust/qros-manifest
        run: cargo test
      - name: Example run
        working-directory: integrations/rust/qros-manifest
        run: cargo run --example emit_run -- out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ingest the Rust manifest
        run: |
          python -m pip install -e .
          mkdir -p /tmp/reg && cd /tmp/reg
          qros init
          qros ingest "$GITHUB_WORKSPACE/integrations/rust/qros-manifest/out/qros-run.json"
          qros exp show EXP-0001
          qros verify
